<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowR" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M12,0 L0,6 L12,12 z" fill="#5f6368"/>
    </marker>
    <style>
      .lbl  { font-size: 19px; font-weight: 700; fill: #202124; text-anchor: middle; }
      .sub  { font-size: 14px; fill: #5f6368; text-anchor: middle; }
      .edge { stroke: #5f6368; stroke-width: 2.5; fill: none; }
      .elbl { font-size: 14px; fill: #424242; text-anchor: middle; font-weight: 500; }
      .group-lbl { font-size: 16px; font-weight: 700; fill: #5f6368; }
      .sandbox-lbl { font-size: 13px; font-weight: 600; fill: #5f6368; }
    </style>
  </defs>

  <rect x="430" y="40" width="700" height="700" rx="14" ry="14" fill="#fafafa" stroke="#5f6368" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="450" y="70" class="group-lbl">Embedded device (Raspberry Pi 5)</text>

  <rect x="60" y="120" width="240" height="120" rx="10" ry="10" fill="#f5f5f5" stroke="#5f6368" stroke-width="2.5"/>
  <circle cx="180" cy="170" r="11" fill="#1a73e8"/>
  <path d="M 162,200 a 18,18 0 0 1 36,0" fill="#1a73e8"/>
  <text x="180" y="230" class="lbl">User</text>

  <rect x="550" y="100" width="460" height="100" rx="10" ry="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2.5"/>
  <text x="780" y="140" class="lbl">Touch display GUI</text>
  <text x="780" y="170" class="sub">PIN entry</text>

  <rect x="540" y="240" width="480" height="150" rx="8" ry="8" fill="none" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="555" y="260" class="sandbox-lbl">Sandboxing</text>

  <rect x="600" y="280" width="360" height="90" rx="10" ry="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="780" y="315" class="lbl">AusweisApp (Qt6)</text>
  <text x="780" y="340" class="sub">PACE + EAC + Terminal Auth</text>

  <rect x="630" y="450" width="300" height="80" rx="10" ry="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2.5"/>
  <text x="780" y="485" class="lbl">pcscd</text>
  <text x="780" y="510" class="sub">PC/SC daemon</text>

  <rect x="630" y="600" width="300" height="80" rx="10" ry="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2.5"/>
  <text x="780" y="635" class="lbl">Kernel USB</text>
  <text x="780" y="660" class="sub">CCID class driver</text>

  <rect x="1240" y="280" width="280" height="120" rx="10" ry="10" fill="#fce8e6" stroke="#c5221f" stroke-width="2.5"/>
  <text x="1380" y="330" class="lbl">eID-Server</text>
  <text x="1380" y="355" class="sub">BSI TR-03110</text>
  <text x="1380" y="375" class="sub">verifier</text>

  <rect x="630" y="790" width="300" height="80" rx="10" ry="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="780" y="825" class="lbl">CCID reader</text>
  <text x="780" y="850" class="sub">USB NFC, e.g. OMNIKEY 5022</text>

  <rect x="660" y="910" width="240" height="70" rx="10" ry="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="780" y="945" class="lbl">eID card</text>
  <text x="780" y="965" class="sub">Personalausweis · ISO 14443</text>

  <path class="edge" d="M 300,150 L 550,150" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>
  <text x="425" y="140" class="elbl">touch / view</text>

  <path class="edge" d="M 780,200 L 780,280" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>

  <path class="edge" d="M 960,325 L 1240,325" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>
  <text x="1100" y="316" class="elbl">HTTPS / mTLS</text>

  <path class="edge" d="M 780,370 L 780,450" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>
  <text x="900" y="400" class="elbl">Unix socket</text>
  <text x="900" y="420" class="elbl">root:pcscd</text>

  <path class="edge" d="M 780,530 L 780,600" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>

  <path class="edge" d="M 780,680 L 780,790" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>
  <text x="870" y="715" class="elbl">USB CCID</text>

  <path class="edge" d="M 780,870 L 780,910" marker-end="url(#arrowR)" marker-start="url(#arrowL)"/>
  <text x="935" y="895" class="elbl">NFC + secure messaging</text>
</svg>
