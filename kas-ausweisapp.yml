header:
  version: 11
machine: qemux86-64
distro: poky
target:
  - ausweisapp-image
repos:
  # This repo contains the kas project yaml file - there is no need to fetch it again.
  # It's current revision will be used to perform the build.
  meta-ausweisapp:
  poky:
    url: "https://git.yoctoproject.org/git/poky"
    branch: scarthgap
    path: "layers"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: scarthgap
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-python:
      meta-multimedia:
      meta-filesystems:
      meta-webserver:
  meta-qt6:
    url: "git://code.qt.io/yocto/meta-qt6.git"
    branch: 6.9.3
    path: "layers/meta-qt6"
  meta-stm32mp15x:
    url: "https://github.com/embetrix/meta-stm32mp15x.git"
    branch: scarthgap
    path: "layers/meta-stm32mp15x"
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi.git"
    branch: scarthgap
    path: "layers/meta-raspberrypi"
  meta-raspberrypi-secure:
    url: "https://github.com/embetrix/meta-raspberrypi-secure.git"
    branch: scarthgap
    path: "layers/meta-raspberrypi-secure"
  meta-security:
    url: https://git.yoctoproject.org/meta-security
    branch: scarthgap
    path: "layers/meta-security"
    layers:
      .:
      meta-integrity:
      meta-tpm:
  meta-selinux:
    url: "https://git.yoctoproject.org/git/meta-selinux.git"
    branch: scarthgap
    path: "layers/meta-selinux"
  meta-avb:
    url: "https://github.com/embetrix/meta-avb.git"
    branch: scarthgap
    path: "layers/meta-avb"
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    INHERIT += "rm_work"
    DISTRO_FEATURES:append = " systemd"
    DISTRO_FEATURES:remove=" wayland vulkan x11 ptest"
    INIT_MANAGER = "systemd"
