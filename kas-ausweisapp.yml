header:
  version: 11
machine: qemux86-64
distro: poky
target:
  - ausweisapp-image
repos:
  # This repo contains the kas project yaml file - there is no need to fetch it again.
  # It's current revision will be used to perform the build.
  meta-ausweisapp:
  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    path: "layers/openembedded-core"
    layers:
      meta:
  bitbake:
    url: https://github.com/openembedded/bitbake.git
    branch: "2.18"
    path: "layers/bitbake"
    layers:
      bitbake: disabled
  meta-yocto:
    url: https://github.com/yoctoproject/meta-yocto.git
    branch: wrynose
    path: "layers/meta-yocto"
    layers:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: wrynose
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-python:
      meta-multimedia:
      meta-filesystems:
      meta-webserver:
  meta-qt6:
    url: "git://code.qt.io/yocto/meta-qt6.git"
    branch: "6.11.1"
    path: "layers/meta-qt6"
  meta-security:
    url: https://git.yoctoproject.org/meta-security
    branch: wrynose
    path: "layers/meta-security"
    layers:
      .:
      meta-integrity:
      meta-tpm:
  meta-selinux:
    url: "https://git.yoctoproject.org/git/meta-selinux.git"
    branch: wrynose
    path: "layers/meta-selinux"
  meta-avb:
    url: "https://github.com/embetrix/meta-avb.git"
    branch: wrynose
    path: "layers/meta-avb"
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi.git"
    branch: wrynose
    path: "layers/meta-raspberrypi"
  meta-raspberrypi-secure:
    url: "https://github.com/embetrix/meta-raspberrypi-secure.git"
    branch: wrynose
    path: "layers/meta-raspberrypi-secure"
  meta-swupdate:
    url: "https://github.com/sbabic/meta-swupdate.git"
    branch: wrynose
    path: "layers/meta-swupdate"
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    INHERIT += "rm_work"
    DISTRO_FEATURES:append = " systemd security integrity selinux tpm2"
    DISTRO_FEATURES_OPTED_OUT:append = " alsa bluetooth debuginfod nfs pci 3g nfc pulseaudio opengl wayland vulkan x11 ptest"

